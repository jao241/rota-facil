services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rota_facil}
      POSTGRES_USER: ${POSTGRES_USER:-rota_facil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-use}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/001-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rota_facil} -d ${POSTGRES_DB:-rota_facil}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    environment:
      tile_urls: ${VALHALLA_TILE_URL:-https://download.geofabrik.de/south-america/brazil/nordeste-latest.osm.pbf}
      server_threads: 2
      build_elevation: "False"
    ports:
      - "8002:8002"
    volumes:
      - valhalla_data:/custom_files

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rota_facil}:${POSTGRES_PASSWORD:-change-me-for-local-use}@db:5432/${POSTGRES_DB:-rota_facil}?schema=public
      VALHALLA_URL: http://valhalla:8002
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:9000}
      NODE_ENV: ${NODE_ENV:-development}
      CPF_HASH_SECRET: ${CPF_HASH_SECRET:-local-only-change-before-production}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run start:dev"

  web:
    build: ./apps/web
    environment:
      VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "9000:9000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
  valhalla_data:
  api_node_modules:
  web_node_modules:
